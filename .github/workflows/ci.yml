name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Build Docker image
        run: docker build -t devops-lab:ci .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          docker tag devops-lab:ci ghcr.io/emmy16-glitch/devops-lab:latest
          docker tag devops-lab:ci ghcr.io/emmy16-glitch/devops-lab:${{ github.sha }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ghcr.io/emmy16-glitch/devops-lab:latest
          docker push ghcr.io/emmy16-glitch/devops-lab:${{ github.sha }}


  deploy:
    needs: test-and-build

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on:
      - self-hosted
      - devops-lab

    steps:
      - name: Update deployment files
        run: |
          cd /mnt/vulnhunter-data/devops-lab/app
          git pull --ff-only

      - name: Pull latest Docker image
        run: |
          cd /mnt/vulnhunter-data/devops-lab/app
          docker compose pull

      - name: Deploy application
        run: |
          cd /mnt/vulnhunter-data/devops-lab/app
          docker compose up -d

      - name: Verify deployment
        run: |
          cd /mnt/vulnhunter-data/devops-lab/app

          for i in {1..12}; do
            if curl --fail --silent --show-error http://localhost:3000/health; then
              echo
              echo "Deployment is healthy"
              docker compose ps
              exit 0
            fi

            echo "Waiting for application..."
            sleep 5
          done

          echo "Deployment health check failed"
          docker compose ps
          docker compose logs --tail=100
          exit 1
